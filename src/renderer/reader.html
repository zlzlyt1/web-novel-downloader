<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>阅读器</title>
  <link rel="stylesheet" href="reader.css" />
</head>
<body>
  <div class="reader">
    <header class="topbar">
      <button id="btnToc" class="icon-btn" title="打开/收起目录">目录</button>
      <button id="btnShelf" class="icon-btn" title="打开书架">书架</button>
      <div class="top-title" id="topTitle">阅读器</div>
      <div class="top-ops">
        <button id="btnOpen" class="icon-btn" title="打开 EPUB / Markdown / TXT 文件">打开</button>
        <button id="btnSettings" class="icon-btn settings-trigger" title="打开阅读设置" aria-expanded="false">设置</button>
      </div>
    </header>

    <aside id="settingsPanel" class="settings-panel" aria-label="阅读设置">
      <div class="settings-actions">
        <button id="btnTheme" class="settings-action" title="切换主题"><span>主题</span><strong>切换</strong></button>
        <button id="btnReadingMode" class="settings-action" title="切换翻页方式"><span>翻页方式</span><strong>上下</strong></button>
        <button id="btnConvert" class="settings-action" title="在 EPUB / Markdown / TXT 之间转换" disabled><span>格式转换</span><strong>EPUB / MD / TXT</strong></button>
      </div>
      <button id="btnTypographySettings" class="settings-section-toggle" aria-expanded="false">
        <span>排版与翻页按键</span><span class="settings-chevron">⌄</span>
      </button>
      <div id="typePanel" class="type-panel">
        <div class="tp-row">
          <span class="tp-label">字号</span>
          <button id="tpFontDec" class="tp-btn" title="减小字号">−</button>
          <span id="tpFontVal" class="tp-val">18</span>
          <button id="tpFontInc" class="tp-btn" title="增大字号">+</button>
        </div>
        <div class="tp-row">
          <span class="tp-label">行距</span>
          <button id="tpLineDec" class="tp-btn" title="减小行距">−</button>
          <span id="tpLineVal" class="tp-val">1.9</span>
          <button id="tpLineInc" class="tp-btn" title="增大行距">+</button>
        </div>
        <div class="tp-row">
          <span class="tp-label">段距</span>
          <button id="tpParaDec" class="tp-btn" title="减小段距">−</button>
          <span id="tpParaVal" class="tp-val">1.0</span>
          <button id="tpParaInc" class="tp-btn" title="增大段距">+</button>
        </div>
        <div class="tp-row">
          <span class="tp-label">页边距</span>
          <button id="tpMarginDec" class="tp-btn" title="减小页边距">−</button>
          <span id="tpMarginVal" class="tp-val">24</span>
          <button id="tpMarginInc" class="tp-btn" title="增大页边距">+</button>
        </div>
        <div class="tp-row">
          <span class="tp-label wide">段落优化</span>
          <button id="tpParagraphMode" class="tp-mode-btn" title="将手机阅读器的碎段重组为适合电脑窗口的自然段">开启</button>
        </div>
        <div class="tp-row">
          <span class="tp-label wide">上一页键</span>
          <button id="tpPrevPageKey" class="tp-key-btn" title="点击后按下新的上一页按键">PageUp</button>
        </div>
        <div class="tp-row">
          <span class="tp-label wide">下一页键</span>
          <button id="tpNextPageKey" class="tp-key-btn" title="点击后按下新的下一页按键">PageDown</button>
        </div>
      </div>
    </aside>

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head" id="sidebarTitle">目录</div>
      <ul id="toc" class="toc"></ul>
    </aside>

    <div class="overlay" id="overlay"></div>

    <div id="removeBookModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="removeBookTitle">
      <section class="modal-card">
        <h2 id="removeBookTitle" class="modal-title">移除书籍</h2>
        <p id="removeBookMessage" class="modal-message"></p>
        <p class="modal-detail">仅移出书架会保留小说文件；删除本地文件会将小说及更新记录移入 Windows 回收站，可以恢复。</p>
        <div class="modal-actions">
          <button id="removeBookCancel" class="modal-btn">取消</button>
          <button id="removeBookShelfOnly" class="modal-btn modal-primary">仅移出书架</button>
          <button id="removeBookDeleteLocal" class="modal-btn modal-danger">删除本地文件</button>
        </div>
      </section>
    </div>

    <div id="convertModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="convertTitle">
      <section class="modal-card">
        <h2 id="convertTitle" class="modal-title">转换电子书格式</h2>
        <p id="convertMessage" class="modal-message"></p>
        <div class="format-options" aria-label="选择目标格式">
          <button class="format-option" data-format="txt"><strong>TXT</strong><span>通用纯文本</span></button>
          <button class="format-option" data-format="md"><strong>Markdown</strong><span>保留章节层级</span></button>
          <button class="format-option" data-format="epub"><strong>EPUB</strong><span>电子书阅读格式</span></button>
        </div>
        <p id="convertStatus" class="modal-detail">转换会保留书名、章节和正文；图片与复杂样式会简化。</p>
        <div class="modal-actions">
          <button id="convertCancel" class="modal-btn">取消</button>
        </div>
      </section>
    </div>

    <div id="pageTurnControls" class="page-turn-controls" aria-label="翻页控制">
      <button id="btnPagePrev" class="page-turn-btn page-turn-prev" title="上一页" aria-label="上一页">&lt;</button>
      <button id="btnPageNext" class="page-turn-btn page-turn-next" title="下一页" aria-label="下一页">&gt;</button>
    </div>

    <main class="content" id="content" data-reading-mode="scroll">
      <div class="page-flow" id="pageFlow">
        <div class="chapter-title" id="chapterTitle">—</div>
        <div class="chapter-body" id="chapterBody">
          <p class="placeholder">请在左上角打开一个 EPUB、Markdown 或 TXT 文件开始阅读。</p>
        </div>
        <div class="nav">
          <button id="btnPrev" class="btn">上一章</button>
          <span id="navPos" class="nav-pos">—</span>
          <button id="btnNext" class="btn">下一章</button>
        </div>
      </div>
    </main>
  </div>

  <script src="markdown.js"></script>
  <script src="paragraph-optimizer.js"></script>
  <script src="reader.js"></script>
</body>
</html>
